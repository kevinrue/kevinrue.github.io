      <strong>🚧 This website is under (re-)construction.</strong> For the older version with more content, please visit <a href="https://kevinrue.github.io/academic-2023/" target="_blank">https://kevinrue.github.io/academic-2023/</a>.

  `;
  document.body.insertBefore(banner, document.body.firstChild);
});
</script>
